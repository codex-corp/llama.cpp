name: Build Maple Windows Vulkan

on:
  workflow_dispatch:
  push:
    branches:
      - maple-vulkan-build
  pull_request:
    branches:
      - main

jobs:
  windows-vulkan:
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.321.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\VulkanSDK.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\${env:VULKAN_VERSION}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: cmd
        run: >-
          cmake -S . -B build
          -A x64
          -DGGML_VULKAN=ON
          -DGGML_NATIVE=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_SERVER=ON

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\bin\Release | Select-Object Name,Length
          if (-not (Test-Path build\bin\Release\llama-server.exe)) { throw 'llama-server.exe missing' }
          if (-not (Test-Path build\bin\Release\llama-cli.exe)) { throw 'llama-cli.exe missing' }

      - name: Package Jan bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build\bin\Release\* package\ -Recurse -Force
          Copy-Item LICENSE package\LICENSE -Force

          # CMake links the Windows server/common DLLs against the OpenSSL 3
          # installation on the GitHub runner. The runtime DLLs are not emitted
          # into build/bin/Release automatically, so bundle them explicitly.
          $opensslBin = 'C:\Program Files\OpenSSL\bin'
          $ssl = Join-Path $opensslBin 'libssl-3-x64.dll'
          $crypto = Join-Path $opensslBin 'libcrypto-3-x64.dll'
          if (-not (Test-Path $ssl)) { throw "Missing OpenSSL runtime: $ssl" }
          if (-not (Test-Path $crypto)) { throw "Missing OpenSSL runtime: $crypto" }
          Copy-Item $ssl package\ -Force
          Copy-Item $crypto package\ -Force

          Compress-Archive -Path package\* -DestinationPath maple-llama-windows-vulkan-x64.zip -Force

      - name: Verify packaged runtime dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path package\libssl-3-x64.dll)) { throw 'libssl-3-x64.dll missing from package' }
          if (-not (Test-Path package\libcrypto-3-x64.dll)) { throw 'libcrypto-3-x64.dll missing from package' }
          Get-ChildItem package\lib*-3-x64.dll | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maple-llama-windows-vulkan-x64
          path: maple-llama-windows-vulkan-x64.zip
          if-no-files-found: error
